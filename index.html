<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="builder-api" content="https://zeywin-android-builder-api.vercel.app">
<meta name="builder-key" content="3e9b0ac6ecd43c716a5c80255f6936b163a3ceaa">
<link rel="stylesheet" href="styles-20260626.css">
</head>
<body>
<header style="position:relative">
<div style="display:flex;align-items:center;padding:10px 16px;background:#161b22">
<h1 style="margin:0;font-size:24px;color:#f0f6fc;flex-shrink:0">ZeyWin CI/CD</h1>
<div id="loading" class="spinner-inline" style="margin:0 auto"><div class="spinner"></div></div>
</div>
<button id="new-build" style="position:absolute;right:16px;top:50%;transform:translateY(-50%)">+ Новая сборка</button>
</header>

<div id="modal" class="hidden">
<form id="build-form">
<div class="form-row">
<label style="flex:3">Игра
<select name="game_repository" id="repo-select">
<option value="zey-win/plinko">Plinko</option>
<option value="zey-win/blackjack">Blackjack</option>
<option value="zey-win/roulette">Roulette</option>
<option value="zey-win/dragon-tiger">Dragon Tiger</option>
<option value="zey-win/baccarat-tiger">Baccarat Tiger</option>
<option value="zey-win/wheel-of-fortune">Wheel of Fortune</option>
<option value="zey-win/Unstopable">Unstopable</option>
<option value="zey-win/SlotSpot">SlotSpot</option>
</select>
</label>
<label style="flex:2">Ветка
<select name="game_ref" id="branch-select">
</select>
</label>
</div>

<div class="icon-format-row">
<div class="icon-col">
<div id="icon-wrapper">
<img id="game-icon" src="" alt="" style="width:72px;height:72px;border-radius:10px;display:none">
<div id="icon-spinner" class="icon-spinner" style="display:none"></div>
</div>
<div class="icon-btns">
<label class="icon-btn icon-btn-upload" id="icon-upload-label">
<input type="file" id="icon-file" accept="image/png" style="display:none">
📷 Загрузить
</label>
<button type="button" id="icon-gen-btn" class="icon-btn icon-btn-gen" title="Сгенерировать">🔄 Генерировать</button>
</div>
</div>
<div class="format-col">
<div class="ver-format-row">
<label style="flex:1">Формат <select name="build_format">
<option value="apk">APK</option>
<option value="aab">AAB</option>
<option value="apk_aab">APK+AAB</option>
</select></label>
<label style="flex:1">Версия
<div style="display:flex;gap:4px;align-items:center">
<input name="version_name" id="f-version" type="number" step="0.1" value="1" style="flex:1">
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="-1">−</button>
</div>
</label>
</div>
<div class="arch-vc-row">
<label style="flex:1">bit's <select name="fast_build">
<option value="false">32x+64x</option>
<option value="true">64x</option>
</select></label>
<label style="flex:1">Version Code
<div style="display:flex;gap:4px;align-items:center">
<input name="version_code" id="f-vcode" type="number" step="1" value="1" style="flex:1">
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="-1">−</button>
</div>
</label>
</div>
</div>
</div>

<label style="margin-top:-25px">Название приложения <input name="app_name" id="f-app-name"></label>
<label>Package name <input name="package_name"></label>
<label>ZeyWin API Key <input name="zeywin_api_key"></label>
<label>AdMob App ID <input name="admob_app_id" id="f-admob-app"></label>
<label class="admob-hidden admob-field">AdMob Banner <input name="admob_banner"></label>
<label class="admob-hidden admob-field">AdMob Interstitial <input name="admob_interstitial"></label>
<label class="admob-hidden admob-field">AdMob Rewarded <input name="admob_rewarded"></label>
<label class="firebase-row" id="firebase-label">
<span style="font-size:15px;font-weight:600">Firebase</span>
<input type="file" id="firebase-file" accept=".json" style="display:none">
<span class="firebase-btn" id="firebase-btn">Загрузить</span>
<span id="firebase-status" style="font-size:13px;color:#fff;display:none;margin-left:8px"></span>
</label>

<div class="modal-actions">
<button type="button" id="modal-cancel">Отмена</button>
<button type="submit" id="modal-submit">Собрать</button>
</div>
</form>
<div id="build-progress" class="hidden">
<div id="bp-steps"></div>
</div>
</div>

<script src="builder.js?v3"></script>
</body>
</html>
