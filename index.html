<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="builder-api" content="https://zeywin-android-builder-api.vercel.app">
<meta name="builder-key" content="3e9b0ac6ecd43c716a5c80255f6936b163a3ceaa">
<link rel="stylesheet" href="styles-20260625.css">
</head>
<body>
<header>
<div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:10px 16px;background:#161b22">
<h1 style="margin:0;font-size:24px;color:#f0f6fc">ZeyWin CI/CD</h1>
<div id="loading" class="spinner-inline" style="text-align:center"><div class="spinner"></div></div>
<button id="new-build" style="justify-self:end">+ Новая сборка</button>
</div>
</header>

<div id="modal" class="hidden">
<form id="build-form">
<label>Игра
<select name="game_repository" id="repo-select">
<option value="zey-win/plinko">Plinko</option>
<option value="zey-win/blackjack">Blackjack</option>
<option value="zey-win/roulette">Roulette</option>
<option value="zey-win/dragon-tiger">Dragon Tiger</option>
<option value="zey-win/baccarat-tiger">Baccarat Tiger</option>
<option value="zey-win/wheel-of-fortune">Wheel of Fortune</option>
<option value="zey-win/Unstopable">Unstopable</option>
<option value="zey-win/SlotSpot">SlotSpot</option>
</select>
</label>
<label>Ветка
<select name="game_ref" id="branch-select">
</select>
</label>

<div id="icon-row" class="fade-in">
<div id="icon-wrapper" style="width:64px;height:64px;border-radius:8px;display:flex;align-items:center;justify-content:center">
<img id="game-icon" src="" alt="" style="width:64px;height:64px;border-radius:8px;display:none">
<div id="icon-spinner" class="icon-spinner" style="display:none"></div>
</div>
<label class="icon-upload" id="icon-upload-label">
<input type="file" id="icon-file" accept="image/png" style="display:none">
📷 Заменить иконку
</label>
</div>

<label>Название приложения <input name="app_name" id="f-app-name"></label>
<label>Package name <input name="package_name"></label>
<label>Формат <select name="build_format">
<option value="apk">APK</option>
<option value="aab">AAB</option>
<option value="apk_aab">APK+AAB</option>
</select></label>
<label>Архитектура <select name="fast_build">
<option value="false">ARMv7 + ARM64 (32+64 бит)</option>
<option value="true">ARM64 (быстрее, меньше APK)</option>
</select></label>
<label>Версия
<div style="display:flex;gap:4px;align-items:center">
<input name="version_name" id="f-version" type="number" step="0.1" value="1" style="flex:1">
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-version" data-step="0.1" data-dir="-1">−</button>
</div>
</label>
<label>Version Code
<div style="display:flex;gap:4px;align-items:center">
<input name="version_code" id="f-vcode" type="number" step="1" value="1" style="flex:1">
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="1">+</button>
<button type="button" class="step-btn" data-target="f-vcode" data-step="1" data-dir="-1">−</button>
</div>
</label>
<label>ZeyWin API Key <input name="zeywin_api_key"></label>
<label>AdMob App ID <input name="admob_app_id" id="f-admob-app"></label>
<label>AdMob Banner <input name="admob_banner"></label>
<label>AdMob Interstitial <input name="admob_interstitial"></label>
<label>AdMob Rewarded <input name="admob_rewarded"></label>
<label class="file-label">google-services.json
<input type="file" id="firebase-file" accept=".json" style="display:none">
<span class="file-btn" id="firebase-btn">📁 Выбрать файл</span>
<span id="firebase-status" style="font-size:11px;color:#3fb950;display:none"></span>
</label>

<div class="modal-actions">
<button type="button" id="modal-cancel">Отмена</button>
<button type="submit">Запустить</button>
</div>
</form>
</div>

<script src="builder.js?v2"></script>
</body>
</html>
